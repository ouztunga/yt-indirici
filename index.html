<!DOCTYPE html>
<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>İndirici</title>
<script async src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-high": "#2a2a2a", "outline-variant": "#464554", "outline": "#908fa0", "surface": "#131313", "surface-container": "#201f1f", "primary": "#c0c1ff", "surface-container-lowest": "#0e0e0e", "on-surface": "#e5e2e1", "on-surface-variant": "#c7c4d7", "secondary-container": "#39485a", "on-secondary-container": "#a7b6cc"} } } }
</script>
<!-- STYLESHEET_PLACEHOLDER -->
</head>
<body class="flex flex-col h-screen">

<main class="flex-1 overflow-hidden bg-surface flex flex-col p-6">
<div class="flex h-full gap-6">

<!-- Sol Kolon: Önizleme -->
<div class="w-[40%] flex flex-col gap-4 overflow-hidden h-full">
    <!-- Normal Thumbnail (Video Kapak Görseli) -->
    <div id="thumbContainer" class="glass-card rounded-xl overflow-hidden shadow-2xl relative aspect-video flex items-center justify-center bg-[#0e0e0e] transition-all duration-300">
        <img id="videoThumb" class="max-w-[70%] max-h-[70%] object-contain cursor-pointer" src="logo.png" onclick="showFullImage()"/>
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent pointer-events-none"></div>
        <div id="sizeBadge" class="absolute top-4 right-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/10 text-xs font-bold text-primary hidden">0.0 MB</div>
    </div>
    
    <!-- Playlist Şarkı Listesi Konteyneri (Sadece Playlist Algılandığında Görünür) -->
    <div id="playlistScrollContainer" class="hidden glass-card p-4 rounded-xl border border-outline-variant flex-1 flex flex-col overflow-hidden transition-all duration-300">
        <div class="mb-3">
            <h3 id="playlistTitle" class="text-sm font-bold text-white truncate">Oynatma Listesi</h3>
            <p id="playlistCountSub" class="text-[11px] text-gray-400">0 Video</p>
        </div>
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-white/5">
            <span class="text-[10px] text-primary font-bold tracking-wider uppercase">LİSTE İÇERİĞİ VE BOYUTLAR</span>
            <span id="playlistTotalSize" class="text-xs text-primary font-semibold">0.0 MB</span>
        </div>
        <div id="playlistItems" class="flex-1 overflow-y-auto custom-scroll pr-1 gap-2 flex flex-col">
            <!-- Şarkılar buraya enjekte edilecek -->
        </div>
    </div>

    <!-- Detay Box (Sadece tek videolarda görünür) -->
    <div id="detailsBox" class="glass-card p-6 rounded-xl border border-outline-variant mt-auto">
        <h3 id="videoTitle" class="text-xl font-bold text-white mb-2">Video Bekleniyor...</h3>
        <p id="videoDesc" class="text-gray-400 text-sm">Link yapıştırın, otomatik analiz edilsin.</p>
    </div>
</div>

<!-- Sağ Kolon: Kontroller -->
<div class="w-[60%] min-w-0 flex flex-col gap-5">
    <div class="glass-card p-6 rounded-xl border border-outline-variant flex flex-col min-w-0">
        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">tune</span>
                <h2 data-i18n="control_center" class="text-xl font-bold text-white">Kontrol Merkezi</h2>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.pywebview &amp;&amp; window.pywebview.api &amp;&amp; pywebview.api.restart_app()" class="flex items-center gap-2 text-xs text-primary hover:text-white transition-colors bg-primary/10 px-3 py-1.5 rounded-full border border-primary/20">
                    <span class="material-symbols-outlined text-sm">restart_alt</span>
                    <span>Yeniden Başlat</span>
                </button>
                <button onclick="resetUI()" class="flex items-center gap-2 text-xs text-gray-400 hover:text-white transition-colors bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
                    <span class="material-symbols-outlined text-sm">refresh</span>
                    <span>Yenile</span>
                </button>
            </div>
        </div>

        <div class="mb-5">
            <div class="flex items-center gap-3 mb-2">
                <label class="text-xs text-gray-400 uppercase tracking-wider">VİDEO URL</label>
                <div id="inputLoader" class="hidden">
                    <div class="animate-spin h-3 w-3 border-2 border-primary border-t-transparent rounded-full"></div>
                </div>
            </div>
            <input id="urlInput" oninput="autoAnalyze(this.value)" class="w-full bg-[#0e0e0e] border border-[#464554] rounded-lg px-4 py-3 text-white focus:border-[#c0c1ff] outline-none transition-all" placeholder="Link yapıştırın, otomatik analiz edilsin..." type="text"/>
        </div>

        <div class="mb-5">
            <label class="text-xs text-gray-400 uppercase block mb-2 tracking-wider">ÇÖZÜNÜRLÜK SEÇİMİ</label>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="setQuality('4320', this)" data-quality="4320" class="res-btn p-1.5 bg-[#0e0e0e] text-gray-400 rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm">8K</span><span class="text-[9px] opacity-70">4320p</span>
                </button>
                <button onclick="setQuality('2160', this)" data-quality="2160" class="res-btn p-1.5 bg-[#0e0e0e] text-gray-400 rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm">4K</span><span class="text-[9px] opacity-70">2160p</span>
                </button>
                <button onclick="setQuality('1440', this)" data-quality="1440" class="res-btn p-1.5 bg-[#0e0e0e] text-gray-400 rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm">2K</span><span class="text-[9px] opacity-70">1440p</span>
                </button>
                <button onclick="setQuality('1080', this)" data-quality="1080" class="res-btn active p-1.5 bg-[#0e0e0e] rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm">1080p</span><span class="text-[9px] opacity-70">Full HD</span>
                </button>
                <button onclick="setQuality('720', this)" data-quality="720" class="res-btn p-1.5 bg-[#0e0e0e] text-gray-400 rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm">720p</span><span class="text-[9px] opacity-70">HD</span>
                </button>
                <button onclick="setQuality('480', this)" data-quality="480" class="res-btn p-1.5 bg-[#0e0e0e] text-gray-400 rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm">480p</span><span class="text-[9px] opacity-70">SD</span>
                </button>
                <button onclick="setQuality('360', this)" data-quality="360" class="res-btn p-1.5 bg-[#0e0e0e] text-gray-400 rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm">360p</span><span class="text-[9px] opacity-70">Low</span>
                </button>
                <button onclick="setQuality('audio', this)" data-quality="audio" class="res-btn p-1.5 bg-[#0e0e0e] text-gray-400 rounded-lg flex flex-col items-center justify-center gap-1">
                    <span class="font-bold text-sm text-center">Ses</span><span class="text-[9px] opacity-70">MP3</span>
                </button>
            </div>
        </div>

        <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
                <label class="text-[11px] text-gray-400 uppercase tracking-wider flex items-center gap-1 font-semibold">
                    <span class="material-symbols-outlined text-sm text-primary">content_cut</span>
                    <span>ZAMAN ARALIĞI KESME (İSTEĞE BAĞLI)</span>
                </label>
                <button onclick="toggleTrimInputs()" id="trimToggleBtn" class="text-[11px] text-primary hover:underline font-semibold cursor-pointer">
                    + Kesme Ekle
                </button>
            </div>
            <div id="trimInputsContainer" class="hidden grid grid-cols-2 gap-3 bg-[#0e0e0e] p-3 rounded-lg border border-[#464554] transition-all">
                <div>
                    <label class="text-[10px] text-gray-400 block mb-1">BAŞLANGIÇ (Örn: 0:03 veya 3)</label>
                    <input id="trimStartInput" type="text" placeholder="00:00" class="w-full bg-[#1c1c1c] border border-white/10 rounded px-3 py-1.5 text-xs text-white outline-none focus:border-[#c0c1ff] transition-all"/>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 block mb-1">BİTİŞ (Örn: 0:10 veya 10)</label>
                    <input id="trimEndInput" type="text" placeholder="00:00" class="w-full bg-[#1c1c1c] border border-white/10 rounded px-3 py-1.5 text-xs text-white outline-none focus:border-[#c0c1ff] transition-all"/>
                </div>
            </div>
        </div>

        <div class="mb-auto">
            <label class="text-xs text-gray-400 uppercase block mb-3 tracking-wider">İNDİRME KONUMU</label>
            <div class="path-container">
                <div class="path-box">
                    <span class="material-symbols-outlined text-gray-400 mr-2 shrink-0">folder_open</span>
                    <span id="pathDisplay" class="text-sm text-gray-400">/Downloads/</span>
                </div>
                <button type="button" onclick="browseFolder()" class="browse-btn">Gözat</button>
            </div>
        </div>

        <div id="downloadControls" class="mt-5">
            <button id="startBtn" onclick="startDownload()" disabled class="w-full bg-[#c0c1ff] text-[#1000a9] py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-4 opacity-50 cursor-not-allowed transition shadow-lg">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">cloud_download</span> <span>İNDİRMEYİ BAŞLAT</span>
            </button>
            
            <div id="activeControls" class="hidden flex gap-3">
                <button id="pauseBtn" onclick="togglePause()" class="flex-1 bg-[#2a2a2a] border border-[#464554] text-white py-4 rounded-xl font-bold text-base flex items-center justify-center gap-3 hover:bg-[#3a3a3a] transition">
                    <span id="pauseIcon" class="material-symbols-outlined">pause</span> <span id="pauseText">DURAKLAT</span>
                </button>
                <button onclick="stopDownload()" class="bg-[#ffc0c0] text-[#a90000] px-6 py-4 rounded-xl font-bold text-base flex items-center justify-center gap-3 hover:opacity-90 transition">
                    <span class="material-symbols-outlined">stop</span> <span>DURDUR</span>
                </button>
            </div>
            
            <div id="finishControls" class="hidden flex gap-3">
                <button onclick="openDownloadFolder()" class="flex-1 bg-[#2a2a2a] border border-[#464554] text-white py-4 rounded-xl font-bold text-base flex items-center justify-center gap-3 hover:bg-[#3a3a3a] transition shadow-lg">
                    <span class="material-symbols-outlined">folder_open</span> <span>İNDİRİLEN KONUMU AÇ</span>
                </button>
                <button onclick="resetUI(true)" class="bg-[#c0c1ff] text-[#1000a9] px-6 py-4 rounded-xl font-bold text-base flex items-center justify-center gap-3 hover:opacity-90 transition shadow-lg">
                    <span class="material-symbols-outlined">add</span> <span>YENİ İNDİRME</span>
                </button>
            </div>
        </div>
    </div>
</div>
</div>
</main>

<div class="w-full">
    <div class="w-full h-1 bg-[#2a2a2a]">
        <div id="progressBar" class="h-full bg-gradient-to-r from-[#c0c1ff] to-[#8083ff] transition-all duration-300" style="width: 0%"></div>
    </div>
    <footer class="bg-[#0e0e0e] border-t border-[#464554] flex justify-between px-8 py-3">
        <span id="statusText" class="text-sm text-gray-400">Sistem Durumu: Çalışıyor</span>
        <span id="versionText" class="text-sm text-gray-500 font-bold tracking-wider">v1.3.0</span>
    </footer>
</div>

<!-- Full-screen Resim Görüntüleyici Modalı -->
<div id="imageModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-6 backdrop-blur-md transition-opacity duration-300 opacity-0" onclick="closeFullImage()">
    <button class="absolute top-6 right-6 text-white/70 hover:text-white bg-white/5 hover:bg-white/10 p-2.5 rounded-full transition-all border border-white/10" onclick="closeFullImage(); event.stopPropagation();">
        <span class="material-symbols-outlined text-2xl flex items-center justify-center">close</span>
    </button>
    <img id="modalImg" class="max-w-[90%] max-h-[90%] object-contain rounded-xl shadow-2xl transition-transform duration-300 scale-90" src="" onclick="event.stopPropagation();"/>
</div>

<!-- SCRIPT_PLACEHOLDER -->
</body></html>
